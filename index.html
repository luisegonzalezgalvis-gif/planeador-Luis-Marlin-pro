    const DEFAULT_SYNC_ROOM = "LUIS-MARLIN-2026";
    const DEFAULT_FIREBASE_URL = "https://planeador-luis-marlin-default-rtdb.firebaseio.com";
    const MASTER_STORAGE_KEY = "luis_marlin_trips_master_v10";
    const DELETED_TRIPS_KEY = "luis_marlin_deleted_trips_v1";
    const FIREBASE_URL_KEY = "planner_firebase_url_custom";

    // Auto-detección por parámetros URL (?room=...&db=...)
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const urlRoom = urlParams.get('room');
      const urlDb = urlParams.get('db');
      if (urlRoom) {
        const clean = urlRoom.toUpperCase().trim().replace(/[^A-Z0-9_-]/g, '');
        if (clean) localStorage.setItem("planner_sync_room", clean);
      }
      if (urlDb) {
        localStorage.setItem(FIREBASE_URL_KEY, urlDb.trim().replace(/\/$/, ''));
      }
    } catch(e) {}

    // Compresor de imágenes para mantener paquetes livianos (<35KB)
    window.compressImage = function(file, maxWidth = 800, maxHeight = 480, quality = 0.55) {
      return new Promise((resolve) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          resolve(null);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    };

    window.CloudEngine = {
      getFirebaseUrl() {
        try {
          return localStorage.getItem(FIREBASE_URL_KEY) || DEFAULT_FIREBASE_URL;
        } catch (e) {
          return DEFAULT_FIREBASE_URL;
        }
      },
      setFirebaseUrl(url) {
        try {
          const clean = (url || DEFAULT_FIREBASE_URL).trim().replace(/\/$/, '');
          localStorage.setItem(FIREBASE_URL_KEY, clean);
          return clean;
        } catch (e) {
          return DEFAULT_FIREBASE_URL;
        }
      },
      getRoomId() {
        try {
          return localStorage.getItem("planner_sync_room") || DEFAULT_SYNC_ROOM;
        } catch (e) {
          return DEFAULT_SYNC_ROOM;
        }
      },
      setRoomId(roomId) {
        try {
          const cleanRoom = (roomId || DEFAULT_SYNC_ROOM).toUpperCase().trim().replace(/[^A-Z0-9_-]/g, '');
          localStorage.setItem("planner_sync_room", cleanRoom || DEFAULT_SYNC_ROOM);
          return cleanRoom || DEFAULT_SYNC_ROOM;
        } catch (e) {
          return DEFAULT_SYNC_ROOM;
        }
      },
      getDeletedTripIds() {
        try {
          return JSON.parse(localStorage.getItem(DELETED_TRIPS_KEY) || '[]');
        } catch(e) {
          return [];
        }
      },
      addDeletedTripId(id) {
        try {
          const current = this.getDeletedTripIds();
          if (!current.includes(id)) {
            current.push(id);
            localStorage.setItem(DELETED_TRIPS_KEY, JSON.stringify(current));
          }
        } catch(e) {}
      },
      sanitizeTrips(trips) {
        return (trips || []).map(t => ({
          ...t,
          coverImage: (t.coverImage && t.coverImage.length > 250000) ? '' : t.coverImage,
          days: (t.days || []).map(d => ({
            ...d,
            coverImage: (d.coverImage && d.coverImage.length > 250000) ? '' : d.coverImage,
            mapUrl: d.mapUrl || '',
            outfits: d.outfits ? {
              marlin: {
                desc: d.outfits.marlin?.desc || '',
                footwear: d.outfits.marlin?.footwear || '',
                photo: (d.outfits.marlin?.photo && d.outfits.marlin.photo.length > 250000) ? '' : (d.outfits.marlin?.photo || '')
              },
              luis: {
                desc: d.outfits.luis?.desc || '',
                footwear: d.outfits.luis?.footwear || '',
                photo: (d.outfits.luis?.photo && d.outfits.luis.photo.length > 250000) ? '' : (d.outfits.luis?.photo || '')
              }
            } : null,
            activities: (d.activities || []).map(a => ({
              ...a,
              photo: (a.photo && a.photo.length > 250000) ? '' : a.photo
            }))
          })),
          stays: (t.stays || []).map(s => ({
            ...s,
            image: (s.image && s.image.length > 250000) ? '' : s.image
          }))
        }));
      },
      async fetchCloudPayload(customRoom) {
        const room = customRoom || this.getRoomId();
        const baseUrl = this.getFirebaseUrl();
        const timestamp = Date.now();

        try {
          const fbUrl = `${baseUrl}/rooms/${room}.json?_t=${timestamp}`;
          const fbRes = await fetch(fbUrl, { cache: 'no-store' });
          if (fbRes.ok) {
            const fbData = await fbRes.json();
            if (fbData && Array.isArray(fbData.trips)) {
              return fbData;
            }
          }
        } catch (e) {}

        return null;
      },
      async pushCloudPayload(payload, customRoom) {
        const room = customRoom || this.getRoomId();
        const baseUrl = this.getFirebaseUrl();
        const cleanTrips = this.sanitizeTrips(payload.trips);
        const deletedIds = this.getDeletedTripIds();
        const cleanPayload = { 
          trips: cleanTrips, 
          deletedTripIds: deletedIds,
          updatedAt: payload.updatedAt || Date.now() 
        };

        try {
          const fbUrl = `${baseUrl}/rooms/${room}.json`;
          const fbRes = await fetch(fbUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cleanPayload)
          });
          if (fbRes.ok) return true;
        } catch (e) {}

        return false;
      }
    };
  </script>

    // Helper para limpiar y normalizar enlaces de Google Maps
    function cleanMapUrl(rawUrl) {
      if (!rawUrl) return '';
      let url = String(rawUrl).trim();
      // Si el usuario pegó el código HTML de iframe (<iframe src="..."/>)
      const iframeMatch = url.match(/src=["']([^"']+)["']/i);
      if (iframeMatch && iframeMatch[1]) {
        url = iframeMatch[1];
      }
      url = url.replace(/["'<>]/g, '').trim();
      if (!url) return '';
      // Si pegó el enlace sin https:// (ej. maps.app.goo.gl/... o www.google.com/...)
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      return url;
    }

    // Helper para generar URLs de navegación en Google Maps
    function generateGoogleMapsRoute(activities, customMapUrl = '', tripCityContext = '') {
      // 1. Si el usuario pegó su propia ruta armada en Google Maps, tiene prioridad 100%
      const cleanedCustom = cleanMapUrl(customMapUrl);
      if (cleanedCustom) {
        return cleanedCustom;
      }
      if (!activities || activities.length === 0) return null;

      // 2. Extraer puntos limpios y eliminar duplicados consecutivos
      const rawPoints = activities
        .map(a => {
          const t = (a.title || '').trim();
          const c = (a.city || tripCityContext || '').trim();
          if (!t) return '';
          // Asegurar que siempre lleve la ciudad para evitar que Maps ubique lugares en Colombia
          const hasCity = c && t.toLowerCase().includes(c.toLowerCase());
          return hasCity ? t : `${t}, ${c}`;
        })
        .filter(p => p.length > 0);

      if (rawPoints.length === 0) return null;

      // Deduplicar puntos idénticos consecutivos (ej: Rockefeller repetido)
      const points = [];
      rawPoints.forEach(pt => {
        if (points.length === 0 || points[points.length - 1].toLowerCase() !== pt.toLowerCase()) {
          points.push(pt);
        }
      });

      if (points.length === 1) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(points[0])}`;
      }

      // Limitar a máximo 9 paradas (límite estándar de Google Maps URLs)
      const safePoints = points.slice(0, 9);
      const origin = encodeURIComponent(safePoints[0]);
      const destination = encodeURIComponent(safePoints[safePoints.length - 1]);
      let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;

      if (safePoints.length > 2) {
        const waypoints = safePoints.slice(1, -1).map(p => encodeURIComponent(p)).join('|');
        url += `&waypoints=${waypoints}`;
      }
      url += `&travelmode=walking`;
      return url;
    }

    function formatMoney(amount, currencyCode = 'COP') {
      const num = Number(amount) || 0;
      if (currencyCode === 'COP') {
        return `$${Math.round(num).toLocaleString('es-CO')} COP`;
      } else if (currencyCode === 'EUR') {
        return `€${num.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
      } else if (currencyCode === 'JPY') {
        return `¥${num.toLocaleString('ja-JP')}`;
      } else {
        return `$${num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 })} USD`;
      }
    }

    function saveToLocalStorage(tripsList) {
      const timestamp = Date.now();
      const payload = { trips: tripsList, updatedAt: timestamp };
      try {
        localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        const safeTrips = tripsList.map(t => ({
          ...t,
          coverImage: (t.coverImage && t.coverImage.length > 50000) ? PRESET_COVERS[0].url : t.coverImage,
          days: (t.days || []).map(d => ({
            ...d,
            coverImage: (d.coverImage && d.coverImage.length > 50000) ? PRESET_COVERS[0].url : d.coverImage,
            activities: (d.activities || []).map(a => ({
              ...a,
              photo: (a.photo && a.photo.length > 50000) ? '' : a.photo
            }))
          })),
          stays: (t.stays || []).map(s => ({
            ...s,
            image: (s.image && s.image.length > 50000) ? '' : s.image
          }))
        }));
        try {
          localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify({ trips: safeTrips, updatedAt: timestamp }));
        } catch (e2) {}
      }
      return timestamp;
    }

    function App() {
      const [syncRoom, setSyncRoom] = useState(() => window.CloudEngine.getRoomId());
      const [firebaseUrl, setFirebaseUrl] = useState(() => window.CloudEngine.getFirebaseUrl());
      const lastLocalUpdateRef = useRef(Date.now());
      
      const [trips, setTrips] = useState(() => {
        try {
          const raw = localStorage.getItem(MASTER_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.trips) && parsed.trips.length > 0) {
              return parsed.trips;
            }
          }
        } catch (e) {}
        return [];
      });

      const [activeTripId, setActiveTripId] = useState(() => trips.length > 0 ? trips[0].id : null);
      const [activeTab, setActiveTab] = useState('cronograma');
      const [searchQuery, setSearchQuery] = useState('');
      const [syncBadge, setSyncBadge] = useState('Conectando Nube...');
      const [isSyncing, setIsSyncing] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const [selectedCronogramaDayId, setSelectedCronogramaDayId] = useState('overview');
      const [selectedDayIdForActivity, setSelectedDayIdForActivity] = useState(null);

      // Referencia para scroll de pestañas de días
      const dayTabsContainerRef = useRef(null);

      // Modales
      const [showNewTripModal, setShowNewTripModal] = useState(false);
      const [showEditTripModal, setShowEditTripModal] = useState(false);
      const [showDayModal, setShowDayModal] = useState(false);
      const [showEditDayModal, setShowEditDayModal] = useState(false);
      const [editingDay, setEditingDay] = useState(null);

      const [showActivityModal, setShowActivityModal] = useState(false);
      const [showEditActivityModal, setShowEditActivityModal] = useState(false);
      const [editingActivity, setEditingActivity] = useState(null);

      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [showFlightModal, setShowFlightModal] = useState(false);
      const [showStayModal, setShowStayModal] = useState(false);
      const [showAiModal, setShowAiModal] = useState(false);
      const [showCloudConfigModal, setShowCloudConfigModal] = useState(false);
      const [showQuickMapModal, setShowQuickMapModal] = useState(false);
      const [quickMapDay, setQuickMapDay] = useState(null);
      const [showOutfitModal, setShowOutfitModal] = useState(false);
      const [editingOutfitDay, setEditingOutfitDay] = useState(null);

      // Asistente IA
      const [aiQuery, setAiQuery] = useState('');
      const [aiApiKey, setAiApiKey] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiResult, setAiResult] = useState(null);

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      const activeTrip = useMemo(() => {
        return trips.find(t => t.id === activeTripId) || trips[0] || null;
      }, [trips, activeTripId]);

      // Lista ordenada de días del viaje activo
      const activeTripDays = useMemo(() => {
        if (!activeTrip || !activeTrip.days) return [];
        return [...activeTrip.days].sort((a, b) => (Number(a.dayNumber) || 0) - (Number(b.dayNumber) || 0));
      }, [activeTrip]);

      // Navegación secuencial de días
      const currentDayIndex = useMemo(() => {
        if (!activeTripDays || selectedCronogramaDayId === 'overview') return -1;
        return activeTripDays.findIndex(d => d.id === selectedCronogramaDayId);
      }, [activeTripDays, selectedCronogramaDayId]);

      const handlePrevDay = () => {
        if (currentDayIndex > 0) {
          setSelectedCronogramaDayId(activeTripDays[currentDayIndex - 1].id);
        } else if (currentDayIndex === 0) {
          setSelectedCronogramaDayId('overview');
        }
      };

      const handleNextDay = () => {
        if (currentDayIndex === -1 && activeTripDays.length > 0) {
          setSelectedCronogramaDayId(activeTripDays[0].id);
        } else if (currentDayIndex >= 0 && currentDayIndex < activeTripDays.length - 1) {
          setSelectedCronogramaDayId(activeTripDays[currentDayIndex + 1].id);
        }
      };

      const scrollDayTabs = (direction) => {
        if (dayTabsContainerRef.current) {
          const scrollAmount = direction === 'left' ? -220 : 220;
          dayTabsContainerRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      const handleExportJsonBackup = () => {
        const payload = { trips, updatedAt: Date.now() };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Planeador_Luis_Marlin_Respaldo_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("📁 Respaldo descargado correctamente.");
      };

      const handleImportJsonBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed && Array.isArray(parsed.trips) && parsed.trips.length > 0) {
              updateTripsList(parsed.trips);
              showToast("✨ ¡Respaldo importado correctamente!");
            } else if (Array.isArray(parsed) && parsed.length > 0) {
              updateTripsList(parsed);
              showToast("✨ ¡Respaldo importado correctamente!");
            } else {
              showToast("⚠️ El archivo no contiene viajes válidos.");
            }
          } catch (err) {
            showToast("⚠️ Error al leer el archivo.");
          }
        };
        reader.readAsText(file);
      };

      const updateTripsList = async (newList) => {
        setTrips(newList);
        const timestamp = saveToLocalStorage(newList);
        lastLocalUpdateRef.current = timestamp;
        setIsSyncing(true);

        const pushSuccess = await window.CloudEngine.pushCloudPayload({ trips: newList, updatedAt: timestamp }, syncRoom);
        setIsSyncing(false);
        if (pushSuccess) {
          setSyncBadge('Sincronizado Nube');
        } else {
          setSyncBadge('Guardado Local (Sin Nube)');
        }
      };

      const forceManualCloudSync = async () => {
        setIsSyncing(true);
        setSyncBadge('Sincronizando...');
        const timestamp = Date.now();
        lastLocalUpdateRef.current = timestamp;
        saveToLocalStorage(trips);

        const pushOk = await window.CloudEngine.pushCloudPayload({ trips, updatedAt: timestamp }, syncRoom);
        const cloudPayload = await window.CloudEngine.fetchCloudPayload(syncRoom);
        setIsSyncing(false);

        if (cloudPayload && Array.isArray(cloudPayload.trips)) {
          const deletedIds = window.CloudEngine.getDeletedTripIds();
          const cloudTrips = cloudPayload.trips.filter(t => !deletedIds.includes(t.id));
          const merged = [...trips].filter(t => !deletedIds.includes(t.id));

          cloudTrips.forEach(cTrip => {
            const existsIdx = merged.findIndex(m => m.id === cTrip.id);
            if (existsIdx === -1) {
              merged.push(cTrip);
            } else if ((cloudPayload.updatedAt || 0) > timestamp) {
              merged[existsIdx] = cTrip;
            }
          });

          setTrips(merged);
          saveToLocalStorage(merged);
          setSyncBadge('Sincronizado Nube');
          showToast(`✨ ¡Sincronizado con la Nube! (${syncRoom})`);
        } else if (pushOk) {
          setSyncBadge('Sincronizado Nube');
          showToast(`✨ ¡Datos subidos a la Nube! (${syncRoom})`);
        } else {
          setSyncBadge('Sin Conexión Nube');
          showToast(`⚠️ No se pudo conectar a Firebase.`);
        }
      };

      // Loop de sincronización automática en segundo plano
      useEffect(() => {
        let isMounted = true;

        window.CloudEngine.fetchCloudPayload(syncRoom).then(initialData => {
          if (isMounted && initialData && Array.isArray(initialData.trips)) {
            const deletedIds = window.CloudEngine.getDeletedTripIds();
            const validCloud = initialData.trips.filter(t => !deletedIds.includes(t.id));
            if (validCloud.length > 0) {
              setTrips(validCloud);
              saveToLocalStorage(validCloud);
              if (!activeTripId || !validCloud.some(t => t.id === activeTripId)) {
                setActiveTripId(validCloud[0].id);
              }
            }
            setSyncBadge('Sincronizado Nube');
          } else if (isMounted) {
            window.CloudEngine.pushCloudPayload({ trips, updatedAt: Date.now() }, syncRoom).then(ok => {
              if (isMounted) setSyncBadge(ok ? 'Sincronizado Nube' : 'Guardado Local (Sin Nube)');
            });
          }
        });

        const autoSyncLoop = async () => {
          if (Date.now() - lastLocalUpdateRef.current < 4500) return;

          const cloudPayload = await window.CloudEngine.fetchCloudPayload(syncRoom);
          if (isMounted && cloudPayload && Array.isArray(cloudPayload.trips)) {
            const rawLocal = localStorage.getItem(MASTER_STORAGE_KEY);
            let localTimestamp = lastLocalUpdateRef.current;
            if (rawLocal) {
              try {
                const parsed = JSON.parse(rawLocal);
                if (parsed.updatedAt) localTimestamp = Math.max(localTimestamp, parsed.updatedAt);
              } catch(e) {}
            }

            const cloudTimestamp = cloudPayload.updatedAt || 0;
            if (cloudTimestamp > localTimestamp + 1000) {
              const deletedIds = window.CloudEngine.getDeletedTripIds();
              setTrips(() => {
                const cloudTrips = cloudPayload.trips.filter(t => !deletedIds.includes(t.id));
                saveToLocalStorage(cloudTrips);
                return cloudTrips;
              });
              setSyncBadge('Sincronizado Nube');
            }
          }
        };

        const interval = setInterval(autoSyncLoop, 4000);
        return () => { isMounted = false; clearInterval(interval); };
      }, [syncRoom, firebaseUrl]);

      const activeTripStats = useMemo(() => {
        if (!activeTrip) return { totalCost: 0, categoryTotals: {}, remaining: 0 };

        let totals = {
          vuelos: 0, hoteles: 0, transporte_inter: 0,
          transporte_local: 0, comidas: 0, actividades: 0, compras_otros: 0
        };

        (activeTrip.flights || []).forEach(f => { totals.vuelos += Number(f.cost || 0); });
        (activeTrip.stays || []).forEach(s => { totals.hoteles += Number(s.cost || 0); });

        (activeTrip.days || []).forEach(day => {
          (day.activities || []).forEach(act => {
            totals.actividades += Number(act.cost || 0);
          });
        });

        (activeTrip.activities || []).forEach(a => { totals.actividades += Number(a.cost || 0); });

        (activeTrip.expenses || []).forEach(e => {
          const cat = e.category && totals[e.category] !== undefined ? e.category : 'compras_otros';
          totals[cat] += Number(e.cost || 0);
        });

        const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);

        return {
          totalCost: grandTotal,
          categoryTotals: totals,
          remaining: (activeTrip.targetBudget || 0) - grandTotal
        };
      }, [activeTrip]);

      useEffect(() => {
        if (activeTab === 'resumen' && activeTrip && chartRef.current) {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }

          const ctx = chartRef.current.getContext('2d');
          const labels = CATEGORIES.map(c => c.label);
          const dataValues = CATEGORIES.map(c => activeTripStats.categoryTotals[c.id] || 0);
          const colors = CATEGORIES.map(c => c.color);

          chartInstanceRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels,
              datasets: [{
                data: dataValues,
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#0f172a'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                }
              },
              cutout: '65%'
            }
          });
        }
        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
        };
      }, [activeTab, activeTrip, activeTripStats]);

      const handleDeleteTrip = (tripId, tripTitle) => {
        if (trips.length <= 1) {
          showToast("Debes mantener al menos un viaje en tu lista.");
          return;
        }
        window.CloudEngine.addDeletedTripId(tripId);
        const updatedList = trips.filter(t => t.id !== tripId);
        updateTripsList(updatedList);
        if (activeTripId === tripId) {
          setActiveTripId(updatedList[0].id);
        }
        showToast(`Viaje "${tripTitle}" eliminado.`);
      };

      const handleMoveActivity = (dayId, activityId, direction) => {
        if (!activeTrip) return;
        const updatedDays = (activeTrip.days || []).map(day => {
          if (day.id !== dayId) return day;
          const acts = [...(day.activities || [])];
          const idx = acts.findIndex(a => a.id === activityId);
          if (idx === -1) return day;
          
          if (direction === 'up' && idx > 0) {
            const temp = acts[idx];
            acts[idx] = acts[idx - 1];
            acts[idx - 1] = temp;
          } else if (direction === 'down' && idx < acts.length - 1) {
            const temp = acts[idx];
            acts[idx] = acts[idx + 1];
            acts[idx + 1] = temp;
          }
          return { ...day, activities: acts };
        });

        const updatedTrip = { ...activeTrip, days: updatedDays };
        const updatedList = trips.map(t => t.id === activeTrip.id ? updatedTrip : t);
        updateTripsList(updatedList);
      };

      const handleAiSubmit = async (e) => {
        e.preventDefault();
        if (!aiQuery.trim()) return;

        setAiLoading(true);
        setAiResult(null);

        const promptText = aiQuery;
        let generatedProposal = null;

        if (aiApiKey.trim()) {
          try {
            const systemPrompt = "Eres un agente experto en viajes. Proporciona itinerarios paso a paso por días y estimaciones de costos en español.";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${aiApiKey.trim()}`;

            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `Crea un itinerario por días con pasos detallados y presupuesto desglosado para: ${promptText}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (res.ok) {
              const data = await res.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) {
                generatedProposal = {
                  text: text,
                  source: 'Gemini AI'
                };
              }
            }
          } catch (err) {}
        }

        if (!generatedProposal) {
          const structuredText = `📍 **Itinerario Planificado:** ${promptText}

📅 **Día 1: Arribo & Primer Reconocimiento**
• Paso 1 (09:00 AM): Check-in en Hotel ($0 COP)
• Paso 2 (02:00 PM): Recorrido por el centro histórico ($150,000 COP)
• Paso 3 (07:00 PM): Cena típica local ($250,000 COP)

💰 **Presupuesto Estimado Meta:** ${formatMoney(12000000, 'COP')}`;

          generatedProposal = {
            text: structuredText,
            source: 'Motor Inteligente de Viajes'
          };
        }

        setAiResult(generatedProposal);
        setAiLoading(false);
      };

      const copyMarlinShareLink = () => {
        const baseUrl = window.location.origin + window.location.pathname;
        const finalUrl = `${baseUrl}?room=${encodeURIComponent(syncRoom)}&db=${encodeURIComponent(firebaseUrl)}`;

        const copyFallback = () => {
          const tempInput = document.createElement("input");
          tempInput.value = finalUrl;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand("copy");
          document.body.removeChild(tempInput);
          showToast("🔗 ¡Enlace de sincronización copiado al portapapeles!");
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(finalUrl)
            .then(() => showToast("🔗 ¡Enlace de sincronización copiado al portapapeles!"))
            .catch(() => copyFallback());
        } else {
          copyFallback();
        }
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 flex flex-col font-sans">
          
          {/* Header Superior */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-3 sm:px-6">
            <div className="max-w-7xl mx-auto h-16 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <div className="bg-gradient-to-tr from-emerald-500 to-cyan-500 p-1.5 sm:p-2 rounded-xl text-slate-950 shadow-lg shadow-emerald-500/20">
                  <IconPlane className="w-5 h-5 sm:w-6 sm:h-6" />
                </div>
                <div>
                  <h1 className="font-bold text-xs sm:text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent flex items-center gap-1">
                    Planeador Luis & Marlin <span className="text-emerald-400 text-[9px] sm:text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-500/10 border border-emerald-500/30 font-semibold uppercase">PRO</span>
                  </h1>
                  <p className="text-[9px] sm:text-xs text-slate-400 line-clamp-1">Organizador de viajes, cronograma y mapas en tiempo real</p>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                {/* Botón / Estado de Sincronización */}
                <button
                  onClick={() => setShowCloudConfigModal(true)}
                  className="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-950 border border-emerald-500/40 text-emerald-400 text-[10px] font-mono hover:border-emerald-400 transition-all shadow-sm cursor-pointer"
                  title="Configurar y probar conexión con Firebase"
                >
                  <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : syncBadge.includes('Sincronizado') ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="font-bold hidden sm:inline">{isSyncing ? 'Sincronizando...' : syncBadge}</span>
                  <span className="text-slate-400 font-bold">({syncRoom})</span>
                  <IconRefresh className={`w-3.5 h-3.5 text-cyan-400 ml-0.5 ${isSyncing ? 'animate-spin' : ''}`} />
                </button>

                {/* Botón Respaldo Local */}
                <button
                  onClick={handleExportJsonBackup}
                  className="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-xl text-[10px] sm:text-xs font-semibold transition-all"
                  title="Guardar archivo JSON de respaldo"
                >
                  <IconUpload className="w-3.5 h-3.5 text-emerald-400 rotate-180" />
                  <span className="hidden sm:inline">Backup</span>
                </button>

                <label className="cursor-pointer flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-xl text-[10px] sm:text-xs font-semibold transition-all">
                  <IconUpload className="w-3.5 h-3.5 text-cyan-400" />
                  <span className="hidden sm:inline">Importar</span>
                  <input type="file" accept=".json" onChange={handleImportJsonBackup} className="hidden" />
                </label>

                <button
                  onClick={() => setShowAiModal(true)}
                  className="flex items-center gap-1 bg-gradient-to-r from-cyan-500/10 to-blue-500/10 hover:from-cyan-500/20 hover:to-blue-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-xl text-[10px] sm:text-xs font-semibold transition-all"
                >
                  <IconSparkles className="w-3.5 h-3.5 text-cyan-400" />
                  <span className="hidden sm:inline">Asistente</span> IA
                </button>

                <button
                  onClick={() => setShowNewTripModal(true)}
                  className="flex items-center gap-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs font-bold transition-all shadow-lg shadow-emerald-500/20 active:scale-95 whitespace-nowrap"
                >
                  <IconPlus className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                  <span>Nuevo Viaje</span>
                </button>
              </div>
            </div>
          </header>

          {/* Toast */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-300 px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center gap-2 animate-bounce">
              <IconCheckCircle className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-6">
            
            {/* Lista de Viajes */}
            <div className="space-y-3">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <IconMap className="w-4 h-4 text-emerald-400" />
                  Mis Viajes Programados ({trips.length})
                </h2>
                <input
                  type="text"
                  placeholder="Buscar viaje..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-48"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {trips
                  .filter(t => t.title.toLowerCase().includes(searchQuery.toLowerCase()))
                  .map(trip => {
                    const isSelected = trip.id === activeTripId;
                    
                    let spent = 0;
                    (trip.flights || []).forEach(f => spent += Number(f.cost || 0));
                    (trip.stays || []).forEach(s => spent += Number(s.cost || 0));
                    (trip.days || []).forEach(d => (d.activities || []).forEach(a => spent += Number(a.cost || 0)));
                    (trip.activities || []).forEach(a => spent += Number(a.cost || 0));
                    (trip.expenses || []).forEach(e => spent += Number(e.cost || 0));

                    const pct = trip.targetBudget > 0 ? Math.min(Math.round((spent / trip.targetBudget) * 100), 100) : 0;

                    return (
                      <div
                        key={trip.id}
                        onClick={() => { setActiveTripId(trip.id); setSelectedCronogramaDayId('overview'); }}
                        className={`group relative rounded-2xl overflow-hidden cursor-pointer transition-all border ${
                          isSelected
                            ? 'border-emerald-500 ring-2 ring-emerald-500/20 shadow-xl shadow-emerald-500/10'
                            : 'border-slate-800 bg-slate-900/60 hover:border-slate-700'
                        }`}
                      >
                        <div className="h-32 w-full relative overflow-hidden bg-slate-950">
                          <img
                            src={trip.coverImage || PRESET_COVERS[0].url}
                            alt={trip.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80"
                            onError={(e) => { e.target.src = PRESET_COVERS[0].url; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                          
                          {isSelected && (
                            <span className="absolute top-3 right-3 bg-emerald-500 text-slate-950 font-bold text-[10px] uppercase px-2 py-0.5 rounded-full shadow">
                              Activo
                            </span>
                          )}

                          <div className="absolute bottom-2 left-3 right-3">
                            <h3 className="font-bold text-sm text-white line-clamp-1 group-hover:text-emerald-300 transition-colors">
                              {trip.title}
                            </h3>

                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Costo Total ({activeTrip.currency})</label>
                      <input type="number" name="cost" placeholder="2500000" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400 focus:border-emerald-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Código de Reserva</label>
                      <input name="bookingRef" placeholder="AV-9812 / 6 letras" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none uppercase font-mono" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Notas / Terminal / Equipaje</label>
                    <textarea name="notes" rows="2" placeholder="Ej: Terminal 4, incluye maleta de 23kg..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setShowFlightModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition-all">Guardar Vuelo</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Hoteles */}
          {showStayModal && activeTrip && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-base flex items-center gap-2">
                    <IconHotel className="w-5 h-5 text-purple-400" />
                    Registrar Alojamiento / Hotel
                  </h3>
                  <button onClick={() => setShowStayModal(false)} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newStay = {
                      id: 'stay-' + Date.now(),
                      name: formData.get('name'),
                      city: formData.get('city'),
                      checkIn: formData.get('checkIn') || '',
                      checkOut: formData.get('checkOut') || '',
                      cost: Number(formData.get('cost')) || 0,
                      confirmCode: formData.get('confirmCode') || '',
                      image: formData.get('image') || '',
                      notes: formData.get('notes') || ''
                    };

                    const updatedTrip = { ...activeTrip, stays: [newStay, ...(activeTrip.stays || [])] };
                    const updatedList = trips.map(t => t.id === activeTrip.id ? updatedTrip : t);
                    updateTripsList(updatedList);

                    setShowStayModal(false);
                    showToast("Alojamiento registrado correctamente.");
                  }}
                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Nombre del Hotel / Alojamiento *</label>
                    <input name="name" required placeholder="Ej: Manhattan Downtown Hotel" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-purple-500 focus:outline-none" />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Ciudad / Zona *</label>
                    <input name="city" required placeholder="Ej: Nueva York (Midtown)" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-purple-500 focus:outline-none" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Check-In</label>
                      <input type="date" name="checkIn" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-purple-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Check-Out</label>
                      <input type="date" name="checkOut" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-purple-500 focus:outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-purple-400 block mb-1 font-bold">Valor Pagado ({activeTrip.currency}) *</label>
                      <input type="number" name="cost" required placeholder="3200000" className="w-full bg-slate-950 border border-purple-500/50 rounded-xl p-2.5 font-mono text-emerald-400 font-bold focus:border-purple-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Código Confirmación</label>
                      <input name="confirmCode" placeholder="Ej: BKG-88123" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-purple-500 focus:outline-none font-mono uppercase" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Foto del Hotel / Fachada</label>
                    <div className="space-y-2">
                      <label className="cursor-pointer bg-slate-950 border border-slate-800 border-dashed rounded-xl p-2.5 text-center text-slate-400 hover:text-purple-400 hover:border-purple-500/50 transition-all flex items-center justify-center gap-2">
                        <IconUpload className="w-4 h-4" />
                        <span>Subir foto desde celular / PC</span>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={async (e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const compressedUrl = await window.compressImage(file);
                              const input = document.getElementById('stay-image-input');
                              if (input && compressedUrl) input.value = compressedUrl;
                            }
                          }}
                        />
                      </label>
                      <input id="stay-image-input" name="image" placeholder="O pega URL de imagen https://..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 text-[11px] focus:border-purple-500 focus:outline-none" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Notas / Tipo de Habitación / Desayuno</label>
                    <textarea name="notes" rows="2" placeholder="Ej: Habitación King con vista, incluye desayuno tipo buffet..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-purple-500 focus:outline-none"></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setShowStayModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-purple-500 hover:bg-purple-400 text-slate-950 font-bold transition-all">Guardar Hotel</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Asistente IA */}
          {showAiModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2 text-cyan-400 font-bold text-sm sm:text-base">
                    <IconSparkles className="w-5 h-5 text-cyan-400" />
                    <span>Asistente IA de Estimación de Viajes</span>
                  </div>
                  <button onClick={() => { setShowAiModal(false); setAiResult(null); }} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs text-slate-300">
                  <p>Ingresa tu destino o plan para generar un borrador rápido de itinerario:</p>

                  <form onSubmit={handleAiSubmit} className="space-y-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Destino / Plan de Viaje *</label>
                      <input
                        value={aiQuery}
                        onChange={(e) => setAiQuery(e.target.value)}
                        required
                        placeholder="Ej: 7 días en Nueva York en diciembre"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:border-cyan-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-slate-500 block mb-1 text-[10px] uppercase font-bold">Clave Gemini API (Opcional):</label>
                      <input
                        type="password"
                        value={aiApiKey}
                        onChange={(e) => setAiApiKey(e.target.value)}
                        placeholder="Pega tu API Key si deseas conectar directo a Gemini"
                        className="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-2 text-slate-400 focus:border-cyan-500 focus:outline-none font-mono text-[11px]"
                      />
                    </div>

                    <div className="flex justify-end gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => { setShowAiModal(false); setAiResult(null); }}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300"
                      >
                        Cerrar
                      </button>
                      <button
                        type="submit"
                        disabled={aiLoading}
                        className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold flex items-center gap-1.5"
                      >
                        <IconSparkles className="w-4 h-4" />
                        <span>{aiLoading ? "Analizando..." : "Generar Plan"}</span>
                      </button>
                    </div>
                  </form>

                  {aiResult && (
                    <div className="mt-4 p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 space-y-3">
                      <div className="flex items-center justify-between text-[11px] border-b border-slate-800 pb-2">
                        <span className="font-bold text-cyan-400 flex items-center gap-1">
                          <IconCheckCircle className="w-4 h-4 text-emerald-400" />
                          Propuesta Generada
                        </span>
                        <span className="text-slate-500 font-mono text-[10px]">{aiResult.source}</span>
                      </div>

                      <div className="whitespace-pre-line text-slate-200 text-xs leading-relaxed font-sans bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        {aiResult.text}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500 mt-auto">
            Planeador Luis & Marlin Pro &copy; {new Date().getFullYear()} — Sincronización en la nube en tiempo real (Móvil & PC).
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
