<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPlanner Pro - Organizador de Viajes y Presupuestos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone para transpilar JSX en el navegador sin bundling -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js para gráficas financieras de gastos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass-card:hover {
      border-color: rgba(34, 197, 94, 0.3);
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const IconCompass = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    );
    const IconPlus = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    );
    const IconSparkles = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    );
    const IconMap = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
    );
    const IconMapPin = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    );
    const IconCalendar = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );
    const IconPieChart = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
    );
    const IconWallet = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7"/><path d="M18 12h.01"/></svg>
    );
    const IconTicket = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v14"/></svg>
    );
    const IconPlane = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.8-.2-1.6.1-2 .8l-.5.8 4.2 3.3-2.3 2.3-2.2-.7-.7.7 2.3 2.3 2.3 2.3.7-.7-.7-2.2 2.3-2.3 3.3 4.2.8-.5c.7-.4 1-1.2.8-2Z"/></svg>
    );
    const IconHotel = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Z"/><path d="M9 14h6"/><path d="M9 18h6"/><path d="M10 6h4"/><path d="M10 10h4"/></svg>
    );
    const IconReceipt = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6.5a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4H6"/><path d="M12 6v12"/></svg>
    );
    const IconTrash = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    );
    const IconUpload = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    );
    const IconX = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const IconCheckCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );

    const PRESET_COVERS = [
      { name: "Japón (Tokio / Kioto)", url: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1200&auto=format&fit=crop" },
      { name: "China (Muralla / Shanghai)", url: "https://images.unsplash.com/photo-1508804185872-d7badad00f7d?q=80&w=1200&auto=format&fit=crop" },
      { name: "Europa (París / Roma)", url: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1200&auto=format&fit=crop" },
      { name: "Caribe & Playa", url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop" },
      { name: "Nueva York / EE.UU.", url: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?q=80&w=1200&auto=format&fit=crop" }
    ];

    const CATEGORIES = [
      { id: 'vuelos', label: 'Vuelos & Pasajes', color: '#06b6d4' },
      { id: 'hoteles', label: 'Alojamiento & Hoteles', color: '#a855f7' },
      { id: 'transporte_inter', label: 'Transporte Interciudad', color: '#f59e0b' },
      { id: 'transporte_local', label: 'Transporte Local / Metro', color: '#3b82f6' },
      { id: 'comidas', label: 'Comidas & Restoranes', color: '#ef4444' },
      { id: 'actividades', label: 'Actividades & Entradas', color: '#22c55e' },
      { id: 'compras_otros', label: 'Compras & Imprevistos', color: '#ec4899' }
    ];

    const CURRENCIES = [
      { code: 'COP', symbol: '$', name: 'Pesos Colombianos (COP)' },
      { code: 'USD', symbol: '$', name: 'Dólares ($ USD)' },
      { code: 'EUR', symbol: '€', name: 'Euros (€ EUR)' },
      { code: 'JPY', symbol: '¥', name: 'Yenes Japoneses (¥ JPY)' }
    ];

    const INITIAL_TRIPS = [
      {
        id: 'trip-japon-china',
        title: 'Japón & China Experiencia 2026',
        subtitle: 'Tokio, Kioto, Osaka, Pekín y Shanghai',
        startDate: '2026-10-10',
        endDate: '2026-10-28',
        currency: 'USD',
        targetBudget: 4500,
        coverImage: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1200&auto=format&fit=crop',
        notes: 'Viaje de 18 días por Asia. Traer adaptador universal y pasaporte vigente.',
        flights: [
          { id: 'f1', company: 'ANA / Air China', route: 'Bogotá -> Tokio (HND)', date: '2026-10-10', cost: 1350, bookingRef: 'NH8291', notes: 'Incluye 2 maletas de 23kg' }
        ],
        stays: [
          { id: 's1', name: 'Shinjuku Granbell Hotel', city: 'Tokio', checkIn: '2026-10-11', checkOut: '2026-10-15', cost: 480, confirmCode: 'BK-99120', image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=600&auto=format&fit=crop' }
        ],
        activities: [
          { id: 'a1', day: 'Día 1 - Tokio', city: 'Tokio', title: 'Visita al Santuario Meiji & Harajuku', cost: 25, photo: 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=600&auto=format&fit=crop', notes: 'Jardines interiores' },
          { id: 'a2', day: 'Día 3 - Tokio', city: 'Tokio', title: 'teamLab Planets Digital Art', cost: 42, photo: 'https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?q=80&w=600&auto=format&fit=crop', notes: 'Entrada reservada 10:00 AM' }
        ],
        expenses: [
          { id: 'e1', title: 'JR Pass 7 Días (Tren Bala)', category: 'transporte_inter', cost: 340, date: '2026-10-11' },
          { id: 'e2', title: 'Tarjeta Suica Metro', category: 'transporte_local', cost: 60, date: '2026-10-12' },
          { id: 'e3', title: 'Cena Ramen & Sushi Autor', category: 'comidas', cost: 95, date: '2026-10-13' }
        ]
      }
    ];

    const readFileAsDataUrl = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    };

    function formatMoney(amount, currencyCode = 'USD') {
      const num = Number(amount) || 0;
      if (currencyCode === 'COP') {
        return `$${Math.round(num).toLocaleString('es-CO')} COP`;
      } else if (currencyCode === 'EUR') {
        return `€${num.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
      } else if (currencyCode === 'JPY') {
        return `¥${num.toLocaleString('ja-JP')}`;
      } else {
        return `$${num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 })} USD`;
      }
    }

    function App() {
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem('travelplanner_trips');
          return saved ? JSON.parse(saved) : INITIAL_TRIPS;
        } catch (e) {
          return INITIAL_TRIPS;
        }
      });

      const [activeTripId, setActiveTripId] = useState(() => trips.length > 0 ? trips[0].id : null);
      const [activeTab, setActiveTab] = useState('resumen');
      const [searchQuery, setSearchQuery] = useState('');

      const [showNewTripModal, setShowNewTripModal] = useState(false);
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [showActivityModal, setShowActivityModal] = useState(false);
      const [showFlightModal, setShowFlightModal] = useState(false);
      const [showStayModal, setShowStayModal] = useState(false);
      const [showAiModal, setShowAiModal] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      const activeTrip = useMemo(() => {
        return trips.find(t => t.id === activeTripId) || null;
      }, [trips, activeTripId]);

      useEffect(() => {
        try {
          localStorage.setItem('travelplanner_trips', JSON.stringify(trips));
        } catch (e) {}
      }, [trips]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const activeTripStats = useMemo(() => {
        if (!activeTrip) return { totalCost: 0, categoryTotals: {}, remaining: 0 };

        let totals = { vuelos: 0, hoteles: 0, transporte_inter: 0, transporte_local: 0, comidas: 0, actividades: 0, compras_otros: 0 };

        (activeTrip.flights || []).forEach(f => { totals.vuelos += Number(f.cost || 0); });
        (activeTrip.stays || []).forEach(s => { totals.hoteles += Number(s.cost || 0); });
        (activeTrip.activities || []).forEach(a => { totals.actividades += Number(a.cost || 0); });
        (activeTrip.expenses || []).forEach(e => {
          const cat = e.category && totals[e.category] !== undefined ? e.category : 'compras_otros';
          totals[cat] += Number(e.cost || 0);
        });

        const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);

        return {
          totalCost: grandTotal,
          categoryTotals: totals,
          remaining: activeTrip.targetBudget - grandTotal
        };
      }, [activeTrip]);

      useEffect(() => {
        if (activeTab === 'resumen' && activeTrip && chartRef.current) {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }

          const ctx = chartRef.current.getContext('2d');
          const labels = CATEGORIES.map(c => c.label);
          const dataValues = CATEGORIES.map(c => activeTripStats.categoryTotals[c.id] || 0);
          const colors = CATEGORIES.map(c => c.color);

          chartInstanceRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels,
              datasets: [{
                data: dataValues,
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#0f172a'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'right',
                  labels: { color: '#94a3b8', font: { family: 'Inter', size: 11 } }
                }
              },
              cutout: '70%'
            }
          });
        }
      }, [activeTab, activeTrip, activeTripStats]);

      const handleDeleteTrip = (tripId, tripName) => {
        if (trips.length <= 1) {
          showToast("Debes mantener al menos un viaje.");
          return;
        }
        const updated = trips.filter(t => t.id !== tripId);
        setTrips(updated);
        setActiveTripId(updated[0].id);
        showToast(`Viaje "${tripName}" eliminado.`);
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 flex flex-col font-sans">
          
          {/* Header Bar */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-tr from-emerald-500 to-cyan-500 p-2 rounded-xl text-slate-950 shadow-lg shadow-emerald-500/20">
                  <IconCompass className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent flex items-center gap-2">
                    TravelPlanner <span className="text-emerald-400 text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 font-semibold uppercase">PRO</span>
                  </h1>
                  <p className="text-xs text-slate-400">Organizador de Cronogramas, Hoteles & Presupuestos</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowAiModal(true)}
                  className="hidden sm:flex items-center gap-2 bg-gradient-to-r from-cyan-500/10 to-blue-500/10 hover:from-cyan-500/20 hover:to-blue-500/20 text-cyan-300 border border-cyan-500/30 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all"
                >
                  <IconSparkles className="w-4 h-4 text-cyan-400" />
                  Asistente IA de Viajes
                </button>

                <button
                  onClick={() => setShowNewTripModal(true)}
                  className="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-lg shadow-emerald-500/20 active:scale-95"
                >
                  <IconPlus className="w-4 h-4" />
                  Nuevo Viaje
                </button>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-300 px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center gap-2 animate-bounce">
              <IconCheckCircle className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          {}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* Lista de Viajes */}
            <div className="space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <IconMap className="w-4 h-4 text-emerald-400" />
                  Mis Viajes Programados ({trips.length})
                </h2>
                <input
                  type="text"
                  placeholder="Buscar viaje..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {trips
                  .filter(t => t.title.toLowerCase().includes(searchQuery.toLowerCase()))
                  .map(trip => {
                    const isSelected = trip.id === activeTripId;
                    
                    let spent = 0;
                    (trip.flights || []).forEach(f => spent += Number(f.cost || 0));
                    (trip.stays || []).forEach(s => spent += Number(s.cost || 0));
                    (trip.activities || []).forEach(a => spent += Number(a.cost || 0));
                    (trip.expenses || []).forEach(e => spent += Number(e.cost || 0));

                    const pct = trip.targetBudget > 0 ? Math.min(Math.round((spent / trip.targetBudget) * 100), 100) : 0;

                    return (
                      <div
                        key={trip.id}
                        onClick={() => setActiveTripId(trip.id)}
                        className={`group relative rounded-2xl overflow-hidden cursor-pointer transition-all border ${
                          isSelected
                            ? 'border-emerald-500 ring-2 ring-emerald-500/20 shadow-xl shadow-emerald-500/10'
                            : 'border-slate-800 bg-slate-900/60 hover:border-slate-700'
                        }`}
                      >
                        <div className="h-32 w-full relative overflow-hidden bg-slate-950">
                          <img
                            src={trip.coverImage || PRESET_COVERS[0].url}
                            alt={trip.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80"
                            onError={(e) => { e.target.src = PRESET_COVERS[0].url; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                          
                          {isSelected && (
                            <span className="absolute top-3 right-3 bg-emerald-500 text-slate-950 font-bold text-[10px] uppercase px-2 py-0.5 rounded-full shadow">
                              Activo
                            </span>
                          )}

                          <div className="absolute bottom-2 left-3 right-3">
                            <h3 className="font-bold text-sm text-white line-clamp-1 group-hover:text-emerald-300 transition-colors">
                              {trip.title}
                            </h3>
                            <p className="text-[11px] text-slate-300 line-clamp-1">
                              {trip.subtitle || 'Sin descripción'}
                            </p>
                          </div>
                        </div>

                        <div className="p-3 bg-slate-900/90 space-y-2 text-xs">
                          <div className="flex items-center justify-between text-slate-400">
                            <span className="flex items-center gap-1 text-[11px]">
                              <IconCalendar className="w-3 h-3 text-cyan-400" />
                              {trip.startDate || 'Fechas TBD'}
                            </span>
                            <span className="font-mono font-bold text-slate-200">
                              {formatMoney(spent, trip.currency)}
                            </span>
                          </div>

                          <div className="space-y-1">
                            <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                              <span>Presupuesto: {formatMoney(trip.targetBudget, trip.currency)}</span>
                              <span className={pct > 90 ? 'text-red-400 font-bold' : 'text-emerald-400'}>{pct}%</span>
                            </div>

                      name="query"
                      required
                      placeholder="Ej: 15 días en Japón saliendo desde Bogotá"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:border-cyan-500 focus:outline-none"
                    />

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setShowAiModal(false)}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300"
                      >
                        Cerrar
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold"
                      >
                        Generar Estimación con IA
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
            TravelPlanner Pro &copy; {new Date().getFullYear()} — Diseñado para la organización financiera e itinerarios visuales.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
