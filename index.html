    // Compresor ultraligero de imágenes para prevenir QuotaExceededError en localStorage y Nube
    window.compressImage = function(file, maxWidth = 300, maxHeight = 300, quality = 0.35) {
      return new Promise((resolve) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          resolve(null);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    };

    // Motor Nube con respaldo en Firebase RTDB
    window.CloudEngine = {
      getRoomId() {
        try {
          return localStorage.getItem("planner_sync_room") || DEFAULT_SYNC_ROOM;
        } catch (e) {
          return DEFAULT_SYNC_ROOM;
        }
      },
      setRoomId(roomId) {
        try {
          const cleanRoom = (roomId || DEFAULT_SYNC_ROOM).toUpperCase().trim().replace(/[^A-Z0-9_-]/g, '');
          localStorage.setItem("planner_sync_room", cleanRoom || DEFAULT_SYNC_ROOM);
          return cleanRoom || DEFAULT_SYNC_ROOM;
        } catch (e) {
          return DEFAULT_SYNC_ROOM;
        }
      },
      async fetchCloudPayload(customRoom) {
        const room = customRoom || this.getRoomId();
        const timestamp = Date.now();
        try {
          const fbUrl = `https://planeador-luis-marlin-default-rtdb.firebaseio.com/rooms/${room}.json?_t=${timestamp}`;
          const fbRes = await fetch(fbUrl, { cache: 'no-store' });
          if (fbRes.ok) {
            const fbData = await fbRes.json();
            if (fbData && Array.isArray(fbData.trips) && fbData.trips.length > 0) {
              return fbData;
            }
          }
        } catch (e) {}
        return null;
      },
      async pushCloudPayload(payload, customRoom) {
        const room = customRoom || this.getRoomId();
        let success = false;
        try {
          const fbUrl = `https://planeador-luis-marlin-default-rtdb.firebaseio.com/rooms/${room}.json`;
          const fbRes = await fetch(fbUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (fbRes.ok) success = true;
        } catch (e) {}
        return success;
      }
    };
  </script>

    function formatMoney(amount, currencyCode = 'COP') {
      const num = Number(amount) || 0;
      if (currencyCode === 'COP') {
        return `$${Math.round(num).toLocaleString('es-CO')} COP`;
      } else if (currencyCode === 'EUR') {
        return `€${num.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
      } else if (currencyCode === 'JPY') {
        return `¥${num.toLocaleString('ja-JP')}`;
      } else {
        return `$${num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 })} USD`;
      }
    }

    // Guardado local con estrategia anti-saturación
    function saveToLocalStorage(tripsList) {
      const timestamp = Date.now();
      const payload = { trips: tripsList, updatedAt: timestamp };
      try {
        localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        console.warn("Saturación local. Comprimiendo fotos...", err);
        const safeTrips = tripsList.map(t => ({
          ...t,
          coverImage: (t.coverImage && t.coverImage.length > 50000) ? PRESET_COVERS[0].url : t.coverImage,
          days: (t.days || []).map(d => ({
            ...d,
            coverImage: (d.coverImage && d.coverImage.length > 50000) ? PRESET_COVERS[0].url : d.coverImage,
            activities: (d.activities || []).map(a => ({
              ...a,
              photo: (a.photo && a.photo.length > 50000) ? '' : a.photo
            }))
          })),
          stays: (t.stays || []).map(s => ({
            ...s,
            image: (s.image && s.image.length > 50000) ? '' : s.image
          }))
        }));
        try {
          localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify({ trips: safeTrips, updatedAt: timestamp }));
        } catch (e2) {}
      }
      return timestamp;
    }

      const [selectedCronogramaDayId, setSelectedCronogramaDayId] = useState('overview');
      const [toastMessage, setToastMessage] = useState('');

      // Asistente IA
      const [aiQuery, setAiQuery] = useState('');
      const [aiApiKey, setAiApiKey] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiResult, setAiResult] = useState(null);

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      // Función Maestra e Indestructible de Actualización
      const updateTripsList = (newList) => {
        setTrips(newList);
        const timestamp = saveToLocalStorage(newList);
        lastLocalUpdateRef.current = timestamp;
        setSyncBadge('Guardado en Dispositivo');

        window.CloudEngine.pushCloudPayload({ trips: newList, updatedAt: timestamp }, syncRoom)
          .then(ok => { if (ok) setSyncBadge('Sincronizado Nube'); })
          .catch(() => {});
      };

      // Control de Sincronización Nube en Segundo Plano
      useEffect(() => {
        let isMounted = true;
        const autoSyncLoop = async () => {
          if (Date.now() - lastLocalUpdateRef.current < 12000) return;

          const cloudPayload = await window.CloudEngine.fetchCloudPayload(syncRoom);
          if (isMounted && cloudPayload && Array.isArray(cloudPayload.trips) && cloudPayload.trips.length > 0) {
            const rawLocal = localStorage.getItem(MASTER_STORAGE_KEY);
            let localTimestamp = lastLocalUpdateRef.current;
            if (rawLocal) {
              try {
                const parsed = JSON.parse(rawLocal);
                if (parsed.updatedAt) localTimestamp = Math.max(localTimestamp, parsed.updatedAt);
              } catch(e) {}
            }

            const cloudTimestamp = cloudPayload.updatedAt || 0;
            if (cloudTimestamp > localTimestamp + 5000) {
              setTrips(cloudPayload.trips);
              saveToLocalStorage(cloudPayload.trips);
              setSyncBadge('Actualizado de Nube');
            }
          }
        };

        const interval = setInterval(autoSyncLoop, 9000);
        return () => { isMounted = false; clearInterval(interval); };
      }, [syncRoom]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      const activeTrip = useMemo(() => {
        return trips.find(t => t.id === activeTripId) || trips[0] || null;
      }, [trips, activeTripId]);

      const activeTripStats = useMemo(() => {
        if (!activeTrip) return { totalCost: 0, categoryTotals: {}, remaining: 0 };

        let totals = {
          vuelos: 0, hoteles: 0, transporte_inter: 0,
          transporte_local: 0, comidas: 0, actividades: 0, compras_otros: 0
        };

        (activeTrip.flights || []).forEach(f => { totals.vuelos += Number(f.cost || 0); });
        (activeTrip.stays || []).forEach(s => { totals.hoteles += Number(s.cost || 0); });

        (activeTrip.days || []).forEach(day => {
          (day.activities || []).forEach(act => {
            totals.actividades += Number(act.cost || 0);
          });
        });

        (activeTrip.activities || []).forEach(a => { totals.actividades += Number(a.cost || 0); });

        (activeTrip.expenses || []).forEach(e => {
          const cat = e.category && totals[e.category] !== undefined ? e.category : 'compras_otros';
          totals[cat] += Number(e.cost || 0);
        });

        const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);

        return {
          totalCost: grandTotal,
          categoryTotals: totals,
          remaining: (activeTrip.targetBudget || 0) - grandTotal
        };
      }, [activeTrip]);

      useEffect(() => {
        if (activeTab === 'resumen' && activeTrip && chartRef.current) {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }

          const ctx = chartRef.current.getContext('2d');
          const labels = CATEGORIES.map(c => c.label);
          const dataValues = CATEGORIES.map(c => activeTripStats.categoryTotals[c.id] || 0);
          const colors = CATEGORIES.map(c => c.color);

          chartInstanceRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels,
              datasets: [{
                data: dataValues,
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#0f172a'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                }
              },
              cutout: '65%'
            }
          });
        }
      }, [activeTab, activeTrip, activeTripStats]);

      const handleDeleteTrip = (tripId, tripTitle) => {
        if (trips.length <= 1) {
          showToast("Debes mantener al menos un viaje en tu lista.");
          return;
        }
        const updatedList = trips.filter(t => t.id !== tripId);
        updateTripsList(updatedList);
        if (activeTripId === tripId) {
          setActiveTripId(updatedList[0].id);
        }
        showToast(`Viaje "${tripTitle}" eliminado.`);
      };

      const handleAiSubmit = async (e) => {
        e.preventDefault();
        if (!aiQuery.trim()) return;

        setAiLoading(true);
        setAiResult(null);

        const promptText = aiQuery;
        let generatedProposal = null;

        if (aiApiKey.trim()) {
          try {
            const systemPrompt = "Eres un agente experto en viajes internacionales. Proporciona itinerarios paso a paso por días y estimaciones de costos en español.";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${aiApiKey.trim()}`;

            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `Crea un itinerario por días con pasos detallados y presupuesto desglosado para: ${promptText}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (res.ok) {
              const data = await res.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) {
                generatedProposal = {
                  text: text,
                  source: 'Gemini 3 Flash API',
                  tripData: {
                    title: `Viaje IA: ${promptText.substring(0, 25)}...`,
                    subtitle: promptText,
                    targetBudget: 15000000,
                    currency: 'COP',
                    coverImage: PRESET_COVERS[1].url,
                    days: [
                      {
                        id: 'day-ai-1',
                        dayNumber: 1,
                        title: `Día 1: Llegada a ${promptText}`,
                        date: '2026-11-01',
                        coverImage: PRESET_COVERS[1].url,
                        activities: [
                          { id: 'act-ai-1', time: '09:00 AM', title: 'Arribo & Check-in en Hotel', city: promptText, cost: 0, photo: PRESET_COVERS[1].url, notes: 'Sugerido por IA' },
                          { id: 'act-ai-2', time: '03:00 PM', title: 'Tour Gastronómico & Reconocimiento', city: promptText, cost: 350000, photo: PRESET_COVERS[1].url, notes: 'Paseo guiado por el centro' }
                        ]
                      }
                    ],
                    flights: [{ id: 'f-' + Date.now(), company: 'Aerolínea Sugerida', route: `Bogotá -> ${promptText}`, date: '2026-11-01', cost: 4200000, bookingRef: 'AI-FLY' }],
                    stays: [{ id: 's-' + Date.now(), name: 'Hotel Recomendado IA', city: promptText, checkIn: '2026-11-01', checkOut: '2026-11-10', cost: 4800000, image: PRESET_COVERS[1].url }],
                    expenses: [{ id: 'e-' + Date.now(), title: 'Comidas y Transportes Estimados', category: 'comidas', cost: 1200000, date: '2026-11-02' }]
                  }
                };
              }
            }
          } catch (err) {}
        }

        if (!generatedProposal) {
          const structuredText = `📍 **Itinerario Generado:** ${promptText}

📅 **Día 1: Arribo & Primer Reconocimiento**
• Paso 1 (09:00 AM): Check-in en Alojamiento ($0 COP)
• Paso 2 (02:00 PM): Recorrido por el centro histórico ($150,000 COP)
• Paso 3 (07:00 PM): Cena de especialidad local ($250,000 COP)

💰 **Presupuesto Estimado Meta:** ${formatMoney(12000000, 'COP')}`;

          generatedProposal = {
            text: structuredText,
            source: 'Motor Inteligente de Viajes',
            tripData: {
              title: promptText.substring(0, 30),
              subtitle: promptText,
              startDate: '2026-11-10',
              endDate: '2026-11-20',
              currency: 'COP',
              targetBudget: 12000000,
              coverImage: PRESET_COVERS[0].url,
              notes: `Plan creado para: "${promptText}"`,
              days: [
                {
                  id: 'day-gen-1',
                  dayNumber: 1,
                  title: 'Día 1: Bienvenida',
                  date: '2026-11-10',
                  coverImage: PRESET_COVERS[0].url,
                  activities: [
                    { id: 'act-gen-1', time: '09:00 AM', title: 'Acomodación en Hotel', city: promptText, cost: 0, photo: PRESET_COVERS[0].url, notes: 'Llegada' },
                    { id: 'act-gen-2', time: '02:00 PM', title: 'Tour Principal', city: promptText, cost: 150000, photo: PRESET_COVERS[0].url, notes: 'Paseo guiado' }
                  ]
                }
              ],
              flights: [{ id: 'f-' + Date.now(), company: 'Aerolínea Internacional', route: `Bogotá -> ${promptText}`, date: '2026-11-10', cost: 3800000, bookingRef: 'AI-PLAN' }],
              stays: [{ id: 's-' + Date.now(), name: 'Hotel Céntrico Recomendado', city: promptText, checkIn: '2026-11-10', checkOut: '2026-11-20', cost: 5500000, image: PRESET_COVERS[0].url }],
              expenses: [{ id: 'e-' + Date.now(), title: 'Pase de Transporte', category: 'transporte_local', cost: 250000, date: '2026-11-11' }]
            }
          };
        }

        setAiResult(generatedProposal);
        setAiLoading(false);
      };

      const handleImportAiTrip = () => {
        if (!aiResult || !aiResult.tripData) return;
        const newTrip = {
          ...aiResult.tripData,
          id: 'trip-' + Date.now()

        const updatedList = [newTrip, ...trips];
        updateTripsList(updatedList);
        setActiveTripId(newTrip.id);
        setShowAiModal(false);
        setAiResult(null);
        setAiQuery('');

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 flex flex-col font-sans">

          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-3 sm:px-6">

                <div>
                  <h1 className="font-bold text-xs sm:text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent flex items-center gap-1">

                  <p className="text-[9px] sm:text-xs text-slate-400 line-clamp-1">Organizador de viajes, cronograma y presupuestos</p>

                >
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-emerald-400 font-bold hidden sm:inline">{syncBadge}</span>
                  <span className="text-slate-400 font-bold">({syncRoom})</span>
                </button>

                <button
                  onClick={() => setShowAiModal(true)}
                  className="flex items-center gap-1 bg-gradient-to-r from-cyan-500/10 to-blue-500/10 hover:from-cyan-500/20 hover:to-blue-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-xl text-[10px] sm:text-xs font-semibold transition-all"
                >
                  <IconSparkles className="w-3.5 h-3.5 text-cyan-400" />
                  <span className="hidden sm:inline">Asistente</span> IA
                </button>

                <button
                  onClick={() => setShowNewTripModal(true)}
                  className="flex items-center gap-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs font-bold transition-all shadow-lg shadow-emerald-500/20 active:scale-95 whitespace-nowrap"
                >
                  <IconPlus className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                  <span>Nuevo Viaje</span>
                </button>
              </div>
            </div>
          </header>

          {/* Toast de Notificación */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-300 px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center gap-2 animate-bounce">
              <IconCheckCircle className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-6">
            
            {/* Lista de Viajes */}
            <div className="space-y-3">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <IconMap className="w-4 h-4 text-emerald-400" />
                  Mis Viajes Programados ({trips.length})
                </h2>
                <input
                  type="text"
                  placeholder="Buscar viaje..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-48"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {trips
                  .filter(t => t.title.toLowerCase().includes(searchQuery.toLowerCase()))
                  .map(trip => {
                    const isSelected = trip.id === activeTripId;
                    
                    let spent = 0;
                    (trip.flights || []).forEach(f => spent += Number(f.cost || 0));
                    (trip.stays || []).forEach(s => spent += Number(s.cost || 0));
                    (trip.days || []).forEach(d => (d.activities || []).forEach(a => spent += Number(a.cost || 0)));
                    (trip.activities || []).forEach(a => spent += Number(a.cost || 0));
                    (trip.expenses || []).forEach(e => spent += Number(e.cost || 0));

                    const pct = trip.targetBudget > 0 ? Math.min(Math.round((spent / trip.targetBudget) * 100), 100) : 0;

                    return (
                      <div
                        key={trip.id}
                        onClick={() => setActiveTripId(trip.id)}
                        className={`group relative rounded-2xl overflow-hidden cursor-pointer transition-all border ${
                          isSelected
                            ? 'border-emerald-500 ring-2 ring-emerald-500/20 shadow-xl shadow-emerald-500/10'
                            : 'border-slate-800 bg-slate-900/60 hover:border-slate-700'
                        }`}
                      >
                        <div className="h-32 w-full relative overflow-hidden bg-slate-950">
                          <img
                            src={trip.coverImage || PRESET_COVERS[0].url}
                            alt={trip.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80"
                            onError={(e) => { e.target.src = PRESET_COVERS[0].url; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                          
                          {isSelected && (
                            <span className="absolute top-3 right-3 bg-emerald-500 text-slate-950 font-bold text-[10px] uppercase px-2 py-0.5 rounded-full shadow">
                              Activo
                            </span>
                          )}

                          <div className="absolute bottom-2 left-3 right-3">
                            <h3 className="font-bold text-sm text-white line-clamp-1 group-hover:text-emerald-300 transition-colors">
                              {trip.title}
                            </h3>
                            <p className="text-[11px] text-slate-300 line-clamp-1">
                              {trip.subtitle || 'Sin descripción'}
                            </p>
                          </div>
                        </div>

                        <div className="p-3 bg-slate-900/90 space-y-2 text-xs">
                          <div className="flex items-center justify-between text-slate-400">
                            <span className="flex items-center gap-1 text-[11px]">
                              <IconCalendar className="w-3 h-3 text-cyan-400" />
                              {trip.startDate || 'Fechas TBD'}
                            </span>
                            <span className="font-mono font-bold text-slate-200">
                              {formatMoney(spent, trip.currency)}
                            </span>
                          </div>

                          <div className="space-y-1">
                            <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                              <span>Presupuesto: {formatMoney(trip.targetBudget, trip.currency)}</span>
                              <span className={pct > 90 ? 'text-red-400 font-bold' : 'text-emerald-400'}>{pct}%</span>
                            </div>
                            <div className="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                              <div
                                className={`h-full transition-all duration-500 ${pct > 90 ? 'bg-red-500' : 'bg-emerald-500'}`}
                                style={{ width: `${pct}%` }}
                              ></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
              </div>
            </div>

            {/* Vista del Viaje Seleccionado */}
            {activeTrip && (
              <div className="space-y-6 pt-2">
                <div className="relative rounded-3xl overflow-hidden border border-slate-800 bg-slate-900/80 shadow-2xl">
                  <div className="h-44 sm:h-64 w-full relative">
                    <img
                      src={activeTrip.coverImage || PRESET_COVERS[0].url}
                      alt={activeTrip.title}
                      className="w-full h-full object-cover opacity-60"
                      onError={(e) => { e.target.src = PRESET_COVERS[0].url; }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>

                    <div className="absolute top-3 right-3 flex items-center gap-2">
                      <button
                        onClick={() => handleDeleteTrip(activeTrip.id, activeTrip.title)}
                        className="bg-slate-950/80 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-800 p-2 rounded-xl transition-all"
                        title="Eliminar este viaje"
                      >
                        <IconTrash className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="absolute bottom-4 left-4 right-4 flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                      <div className="space-y-1">
                        <span className="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">
                          Viaje Seleccionado
                        </span>
                        <h2 className="text-xl sm:text-3xl font-extrabold text-white pt-0.5 line-clamp-1">
                          {activeTrip.title}
                        </h2>
                        <p className="text-[11px] sm:text-sm text-slate-300 flex items-center gap-1.5 line-clamp-1">
                          <IconMapPin className="w-3.5 h-3.5 text-cyan-400 flex-shrink-0" />
                          {activeTrip.subtitle}
                        </p>
                      </div>

                      <div className="bg-slate-900/90 backdrop-blur border border-slate-800 p-2.5 sm:p-3.5 rounded-2xl flex items-center justify-between sm:justify-start gap-3 sm:gap-4 text-xs font-mono">
                        <div>
                          <span className="text-slate-400 block text-[9px] sm:text-[10px] uppercase font-sans">Gasto Total</span>
                          <span className="text-emerald-400 font-bold text-xs sm:text-base">
                            {formatMoney(activeTripStats.totalCost, activeTrip.currency)}
                          </span>
                        </div>
                        <div className="border-l border-slate-800 pl-3 sm:pl-4">
                          <span className="text-slate-400 block text-[9px] sm:text-[10px] uppercase font-sans">Presupuesto Meta</span>
                          <span className="text-slate-200 font-bold text-xs sm:text-base">
                            {formatMoney(activeTrip.targetBudget, activeTrip.currency)}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Navegación de pestañas */}
                  <div className="border-t border-slate-800/80 bg-slate-900/90 px-3 sm:px-6 py-2.5 flex items-center space-x-1.5 sm:space-x-2 overflow-x-auto no-scrollbar">
                    {[
                      { id: 'cronograma', label: 'Cronograma & Actividades Por Días', icon: IconCalendar },
                      { id: 'resumen', label: 'Resumen & Presupuesto', icon: IconPieChart },
                      { id: 'vuelos', label: 'Vuelos & Pasajes', icon: IconPlane },

                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Título del Viaje *</label>
                    <input
                      name="title"
                      required
                      placeholder="Ej: Perú Mágico / Europa Soñada"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Subtítulo / Ciudades</label>
                    <input
                      name="subtitle"
                      placeholder="Ej: Cusco y Machu Picchu"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Fecha Inicio</label>
                      <input
                        type="date"
                        name="startDate"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Fecha Fin</label>
                      <input
                        type="date"
                        name="endDate"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Moneda Base</label>
                      <select
                        name="currency"
                        defaultValue="COP"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                      >
                        {CURRENCIES.map(c => (
                          <option key={c.code} value={c.code}>{c.name}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Presupuesto Meta</label>
                      <input
                        type="number"
                        name="targetBudget"
                        placeholder="10000000"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Foto Portada del Viaje</label>
                    <div className="space-y-2">
                      <label className="cursor-pointer bg-slate-950 border border-slate-800 border-dashed rounded-xl p-2.5 text-center text-slate-400 hover:text-emerald-400 hover:border-emerald-500/50 transition-all flex items-center justify-center gap-2">
                        <IconUpload className="w-4 h-4" />
                        <span>Cargar foto desde tu dispositivo</span>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={async (e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const compressedUrl = await window.compressImage(file);
                              const input = document.getElementById('new-trip-cover-input');
                              if (input && compressedUrl) input.value = compressedUrl;
                            }
                          }}
                        />
                      </label>

                      <input
                        id="new-trip-cover-input"
                        name="coverImage"
                        placeholder="O pega URL de imagen https://..."
                        defaultValue={PRESET_COVERS[0].url}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Notas de Viaje</label>
                    <textarea
                      name="notes"
                      rows="2"
                      placeholder="Notas importantes, adaptadores, visas..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowNewTripModal(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold"
                    >
                      Crear Viaje
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL REGISTRAR GASTO */}
          {showExpenseModal && activeTrip && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-base">Registrar Nuevo Gasto</h3>
                  <button onClick={() => setShowExpenseModal(false)} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newExpense = {
                      id: 'exp-' + Date.now(),
                      title: formData.get('title'),
                      category: formData.get('category'),
                      cost: Number(formData.get('cost')) || 0,
                      date: formData.get('date')
                    };

                    const updatedTrip = { ...activeTrip, expenses: [newExpense, ...(activeTrip.expenses || [])] };
                    const updatedList = trips.map(t => t.id === activeTrip.id ? updatedTrip : t);
                    updateTripsList(updatedList);

                    setShowExpenseModal(false);
                    showToast("Gasto registrado.");
                  }}
                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Concepto / Descripción *</label>
                    <input
                      name="title"
                      required
                      placeholder="Ej: Pase Metro / Almuerzo"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium font-sans">Categoría</label>
                      <select
                        name="category"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                      >
                        {CATEGORIES.map(c => (
                          <option key={c.id} value={c.id}>{c.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Monto ({activeTrip.currency}) *</label>
                      <input
                        type="number"
                        name="cost"
                        step="0.01"
                        required
                        placeholder="50000"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400 focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Fecha</label>
                    <input
                      type="date"
                      name="date"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-emerald-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowExpenseModal(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold"
                    >
                      Guardar Gasto
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL VUELOS */}
          {showFlightModal && activeTrip && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-base">Registrar Vuelo</h3>
                  <button onClick={() => setShowFlightModal(false)} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newFlight = {
                      id: 'fl-' + Date.now(),
                      company: formData.get('company'),
                      route: formData.get('route'),
                      date: formData.get('date'),
                      cost: Number(formData.get('cost')) || 0,
                      bookingRef: formData.get('bookingRef'),
                      notes: formData.get('notes')
                    };

                    const updatedTrip = { ...activeTrip, flights: [newFlight, ...(activeTrip.flights || [])] };
                    const updatedList = trips.map(t => t.id === activeTrip.id ? updatedTrip : t);
                    updateTripsList(updatedList);

                    setShowFlightModal(false);
                    showToast("Vuelo registrado.");
                  }}
                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Aerolínea / Compañía *</label>
                    <input name="company" required placeholder="Ej: LATAM / Avianca" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Ruta / Trayecto *</label>
                    <input name="route" required placeholder="Ej: Bogotá -> Cusco" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Costo ({activeTrip.currency})</label>
                      <input type="number" name="cost" placeholder="2450000" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Código Reserva</label>
                      <input name="bookingRef" placeholder="LA-7721" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowFlightModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold">Guardar Vuelo</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL HOTELES */}
          {showStayModal && activeTrip && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-base">Registrar Alojamiento / Hotel</h3>
                  <button onClick={() => setShowStayModal(false)} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newStay = {
                      id: 'stay-' + Date.now(),
                      name: formData.get('name'),
                      city: formData.get('city'),
                      checkIn: formData.get('checkIn'),
                      checkOut: formData.get('checkOut'),
                      cost: Number(formData.get('cost')) || 0,
                      confirmCode: formData.get('confirmCode'),
                      image: formData.get('image')
                    };

                    const updatedTrip = { ...activeTrip, stays: [newStay, ...(activeTrip.stays || [])] };
                    const updatedList = trips.map(t => t.id === activeTrip.id ? updatedTrip : t);
                    updateTripsList(updatedList);

                    setShowStayModal(false);
                    showToast("Alojamiento registrado.");
                  }}
                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Nombre Hotel / Ryokan *</label>
                    <input name="name" required placeholder="Ej: Hotel Boutique Cusco" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Ciudad *</label>
                    <input name="city" required placeholder="Ej: Cusco" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Check-In</label>
                      <input type="date" name="checkIn" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Check-Out</label>
                      <input type="date" name="checkOut" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Costo Total ({activeTrip.currency})</label>
                      <input type="number" name="cost" placeholder="3200000" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Foto del Hotel</label>
                      <label className="cursor-pointer bg-slate-950 border border-slate-800 border-dashed rounded-xl p-2 text-center text-slate-400 hover:text-purple-400 hover:border-purple-500/50 transition-all flex items-center justify-center gap-1 text-[11px] mb-1">
                        <IconUpload className="w-3.5 h-3.5" />
                        <span>Subir local</span>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={async (e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const compressedUrl = await window.compressImage(file);
                              const input = document.getElementById('stay-image-input');
                              if (input && compressedUrl) input.value = compressedUrl;
                            }
                          }}
                        />
                      </label>
                      <input id="stay-image-input" name="image" placeholder="O pega URL https://..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-slate-200 text-[11px]" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowStayModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-purple-500 text-slate-950 font-bold">Guardar Hotel</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ASISTENTE IA */}
          {showAiModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2 text-cyan-400 font-bold text-sm sm:text-base">
                    <IconSparkles className="w-5 h-5 text-cyan-400" />
                    <span>Asistente IA de Estimación de Viajes</span>
                  </div>
                  <button onClick={() => { setShowAiModal(false); setAiResult(null); }} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs text-slate-300">
                  <p>
                    Ingresa el destino o los detalles de tu viaje para obtener una estimación de itinerario paso a paso y presupuesto en $COP:
                  </p>

                  <form onSubmit={handleAiSubmit} className="space-y-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Destino / Plan de Viaje *</label>
                      <input
                        value={aiQuery}
                        onChange={(e) => setAiQuery(e.target.value)}
                        required
                        placeholder="Ej: 8 días en Perú o 15 días en New York"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:border-cyan-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-slate-500 block mb-1 text-[10px] uppercase font-bold">Clave Gemini API (Opcional):</label>
                      <input
                        type="password"
                        value={aiApiKey}
                        onChange={(e) => setAiApiKey(e.target.value)}
                        placeholder="Pega tu API Key si deseas usar Gemini 3 Flash directo"
                        className="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-2 text-slate-400 focus:border-cyan-500 focus:outline-none font-mono text-[11px]"
                      />
                    </div>

                    <div className="flex justify-end gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => { setShowAiModal(false); setAiResult(null); }}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300"
                      >
                        Cerrar
                      </button>
                      <button
                        type="submit"
                        disabled={aiLoading}
                        className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold flex items-center gap-1.5"
                      >
                        <IconSparkles className="w-4 h-4" />
                        <span>{aiLoading ? "Analizando..." : "Generar Estimación"}</span>
                      </button>
                    </div>
                  </form>

                  {aiResult && (
                    <div className="mt-4 p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 space-y-3 animate-fadeIn">
                      <div className="flex items-center justify-between text-[11px] border-b border-slate-800 pb-2">
                        <span className="font-bold text-cyan-400 flex items-center gap-1">
                          <IconCheckCircle className="w-4 h-4 text-emerald-400" />
                          Propuesta Generada
                        </span>
                        <span className="text-slate-500 font-mono text-[10px]">{aiResult.source}</span>
                      </div>

                      <div className="whitespace-pre-line text-slate-200 text-xs leading-relaxed font-sans bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        {aiResult.text}
                      </div>

                      <button
                        onClick={handleImportAiTrip}
                        className="w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-extrabold text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition-all flex items-center justify-center gap-2"
                      >
                        <IconPlus className="w-4 h-4 stroke-[3]" />
                        <span>✨ Importar este Viaje a Mis Planes</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500 mt-auto">
            Planeador Luis & Marlin Pro &copy; {new Date().getFullYear()} — Sincronización en la nube en tiempo real (Móvil & PC).
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
